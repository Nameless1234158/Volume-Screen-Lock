name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path '*/build/*' | head -n 1)")
          echo "Projeto encontrado em: $DIR"
          cd "$DIR"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/TelaVolume-v1.0.${{ github.run_number }}.apk"

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TelaVolume-apk
          path: TelaVolume-*.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tela Volume v1.0.${{ github.run_number }}
          files: TelaVolume-*.apk
